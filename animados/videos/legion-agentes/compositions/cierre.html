  <script>
    const tl = gsap.timeline({ paused: true });
    const r = window.__reloj("cierre");
    const fx = window.__fx;

    tl.fromTo("#ci-destello", { opacity: 0.3 }, { opacity: 0, duration: 0.28, ease: "power2.out" }, 0);

    // Los agentes forman fila (vienen de la legion).
    [1, 2, 3, 4, 5].forEach((n, i) => {
      fx.entra(tl, "#ci-ag-" + n, 0.02 + i * 0.06, { y: 110 }, 0.32);
      fx.flota(tl, "#ci-ag-" + n + "-f", 0.7 + i * 0.08, r.dur, 10, 0.55);
    });

    // "legion de agentes": el nombre cae de golpe.
    const nombre = r.p("f6", 3);
    tl.fromTo("#ci-legion", { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.in" }, nombre - 0.12);
    fx.tiembla(tl, "#ci-marca", nombre + 0.08, 4, 10);
    tl.fromTo("#ci-agentes", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.28, ease: "back.out(2)" }, r.p("f6", 4));

    // "hecha a la medida de tu empresa": el marco se ajusta justo a la fila.
    const medida = r.p("f6", 6);
    tl.fromTo("#ci-medida", { opacity: 0, scaleX: 1.3, scaleY: 1.5 }, { opacity: 1, scaleX: 1, scaleY: 1, duration: Math.max(0.3, r.p("f6", 9) - medida + 0.15), ease: "power3.out" }, medida);
    fx.entra(tl, "#ci-empresa", r.p("f6", 11), { y: -30 }, 0.3);

    // "Escribenos y armamos la tuya": el boton, y despues la linea.
    const boton = r.p("f7", 0) + 0.1;
    fx.entra(tl, "#ci-boton", boton, { y: 90 }, 0.36);
    fx.entra(tl, "#ci-linea", r.p("f7", 2), { y: 30 }, 0.3);
    // El boton late hasta el final.
    const latidos = [];
    for (let t = boton + 0.45; t < r.dur - 0.75; t += 0.9) latidos.push(t);
    latidos.forEach((t, i) => {
      fx.golpe(tl, "#ci-boton", t, 1.06);
      tl.fromTo(i % 2 ? "#ci-onda-2" : "#ci-onda-1", { opacity: 0, scaleX: 1, scaleY: 1 }, { keyframes: [{ opacity: 0.85, duration: 0.05 }, { opacity: 0, scaleX: 1.22, scaleY: 1.9, duration: 0.6, ease: "power2.out" }] }, t);
    });

    window.__timelines["cierre"] = tl;
