  <script>
    const tl = gsap.timeline({ paused: true });
    const r = window.__reloj("equipo");
    const fx = window.__fx;

    tl.fromTo("#eq-destello", { opacity: 0.3 }, { opacity: 0, duration: 0.28, ease: "power2.out" }, 0);

    // Tres vistas, una por agente; cada una entra cuando la voz dice "Uno...", "Otro...", "Otro...".
    const t1 = 0;
    const t2 = r.p("f4", 5) - 0.08;
    const t3 = r.p("f4", 11) - 0.08;
    const pasa = (sale, entra, t) => {
      tl.to(sale, { x: -1080, duration: 0.22, ease: "power3.in" }, t);
      tl.to(sale, { opacity: 0, duration: 0.02 }, t + 0.22);
      tl.fromTo(entra, { x: 1080 }, { x: 0, duration: 0.3, ease: "power3.out" }, t + 0.06);
    };
    pasa("#eq-vista-1", "#eq-vista-2", t2);
    pasa("#eq-vista-2", "#eq-vista-3", t3);

    // --- 1. "Uno atiende a tus clientes" ---

    fx.entra(tl, "#eq-ag-1", t1, { y: 120 }, 0.36);
    fx.flota(tl, "#eq-ag-1-f", t1 + 0.4, t2, 10, 0.6);
    tl.fromTo("#eq-b1", { opacity: 0, scale: 0.4, x: -60 }, { opacity: 1, scale: 1, x: 0, duration: 0.28, ease: "back.out(2)", transformOrigin: "0% 100%" }, r.p("f4", 0) + 0.12);
    tl.fromTo("#eq-b2", { opacity: 0, scale: 0.4, x: 60 }, { opacity: 1, scale: 1, x: 0, duration: 0.28, ease: "back.out(2)", transformOrigin: "100% 100%" }, r.p("f4", 1) + 0.02);
    fx.entra(tl, "#eq-b3", r.p("f4", 4), { y: 40 }, 0.3);

    // --- 2. "Otro hace seguimiento a las ventas" ---

    fx.flota(tl, "#eq-ag-2-f", t2 + 0.3, t3, 10, 0.6);
    ["#eq-barra-1", "#eq-barra-2", "#eq-barra-3", "#eq-barra-4"].forEach((b, i) => {
      tl.fromTo(b, { scaleY: 0 }, { scaleY: 1, duration: 0.34, ease: "back.out(1.7)", transformOrigin: "50% 100%" }, r.p("f4", 6) + i * 0.13);
    });
    const sube = r.p("f4", 7) + 0.25;
    tl.to("#eq-flecha", { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, sube);
    tl.fromTo("#eq-punta", { opacity: 0 }, { opacity: 1, duration: 0.1 }, sube + 0.4);
    fx.entra(tl, "#eq-moneda", r.p("f4", 10), { y: 80, rotation: -40 }, 0.32);

    // --- 3. "Otro maneja tus redes" ---
    fx.entra(tl, "#eq-rotulo-3", t3 + 0.08, { x: -200 }, 0.3);
    fx.flota(tl, "#eq-ag-3-f", t3 + 0.3, r.dur, 10, 0.5);
    tl.fromTo("#eq-post", { opacity: 0, y: 200 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, r.p("f4", 12));
    [
      ["#eq-corazon-1", 0, -150, 18],
      ["#eq-corazon-2", 0.12, -170, -16],
      ["#eq-corazon-3", 0.24, -130, 12],
    ].forEach(([c, d, sube, giro]) => {
      const t = r.p("f4", 13) + d;
      tl.fromTo(c, { opacity: 0, scale: 0, y: 0, rotation: 0 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(3)" }, t);
      tl.to(c, { y: sube, rotation: giro, duration: Math.max(0.3, r.dur - t - 0.25), ease: "power1.out" }, t + 0.15);
    });
    fx.entra(tl, "#eq-publicado", r.p("f4", 14), { y: 40 }, 0.3);

    window.__timelines["equipo"] = tl;
  </script>
