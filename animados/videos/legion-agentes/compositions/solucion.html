  <script>
    const tl = gsap.timeline({ paused: true });
    const r = window.__reloj("solucion");
    const fx = window.__fx;

    tl.fromTo("#so-destello", { opacity: 0.3 }, { opacity: 0, duration: 0.28, ease: "power2.out" }, 0);

    // El reloj comido se va y las tareas (vienen de la escena anterior) se ordenan en cuadricula.
    tl.fromTo("#so-reloj", { scale: 1, rotation: 0, opacity: 1 }, { scale: 0, rotation: 140, opacity: 0, duration: 0.32, ease: "power2.in" }, 0.04);
    [
      ["#so-chip-1", -39, -300, -6],
      ["#so-chip-2", 39, -260, 5],
      ["#so-chip-3", -55, -90, 5],
      ["#so-chip-4", 45, -60, -5],
    ].forEach(([chip, x, y, giro], i) => {
      tl.fromTo(chip, { x, y, rotation: giro }, { x: 0, y: 0, rotation: 0, duration: 0.5, ease: "power3.inOut" }, 0.1 + i * 0.04);
    });

    // "creamos": se enciende el nucleo y las cuatro bases donde va a nacer cada agente.
    const creamos = r.p("f3", 1);
    ["#so-base-1", "#so-base-2", "#so-base-3", "#so-base-4"].forEach((b, i) => {
      tl.fromTo(b, { opacity: 0, scaleX: 0 }, { opacity: 0.7, scaleX: 1, duration: 0.3, ease: "power2.out" }, creamos + i * 0.06);
    });
    fx.entra(tl, "#so-nucleo", creamos + 0.12, {}, 0.36);

    // Nace un agente por cada tarea: el primero en "agente", los otros en "para cada una".
    [
      [1, r.p("f3", 3)],
      [2, r.p("f3", 7)],
      [3, r.p("f3", 8)],
      [4, r.p("f3", 9)],
    ].forEach(([n, t]) => {
      tl.to("#so-linea-" + n, { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, t - 0.12);
      fx.entra(tl, "#so-ag-" + n, t, { y: -90 }, 0.36);
      fx.golpe(tl, "#so-chip-" + n, t + 0.22, 1.1);
      fx.flota(tl, "#so-ag-" + n + "-f", t + 0.4, r.dur, 9, 0.7);
    });

    // "inteligencia artificial": el nucleo late y suelta chispas.
    const ia = r.p("f3", 5);
    fx.golpe(tl, "#so-nucleo", ia, 1.22);
    fx.golpe(tl, "#so-nucleo", r.p("f3", 6), 1.22);
    [
      ["#so-onda-1", ia],
      ["#so-onda-2", r.p("f3", 6)],
    ].forEach(([onda, t]) => {
      tl.fromTo(onda, { opacity: 0, scale: 1 }, { keyframes: [{ opacity: 0.9, duration: 0.05 }, { opacity: 0, scale: 3.2, duration: 0.55, ease: "power2.out" }] }, t);
    });
    [
      ["#so-chispa-1", ia + 0.05],
      ["#so-chispa-2", ia + 0.2],
      ["#so-chispa-3", r.p("f3", 6) + 0.05],
    ].forEach(([c, t]) => {
      tl.fromTo(c, { opacity: 0, scale: 0, rotation: -40 }, { opacity: 1, scale: 1.2, rotation: 20, duration: 0.2, ease: "back.out(3)" }, t);
      tl.to(c, { opacity: 0, scale: 0.3, rotation: 80, duration: 0.3, ease: "power2.in" }, t + 0.3);
    });

    window.__timelines["solucion"] = tl;
  </script>
