  <script>
    const tl = gsap.timeline({ paused: true });
    const aparece = (sel, t, extra = {}) =>
      tl.fromTo(sel, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", ...extra }, t);

    // 0.00 "Cuando la cortas": la cebolla sube (viene de la escena anterior) y llega el cuchillo.

    tl.fromTo("#co-cuchillo", { y: -620, rotation: -10 }, { y: 0, rotation: 0, duration: 0.38, ease: "power3.out" }, 0.3);
    tl.to("#co-cuchillo", { y: -46, duration: 0.12, ease: "power2.out" }, 0.68);
    // 0.84 corte.
    tl.to("#co-cuchillo", { y: 400, duration: 0.1, ease: "power4.in" }, 0.8);
    tl.set("#co-entera", { opacity: 0 }, 0.86);
    tl.set(["#co-mitad-izq", "#co-mitad-der"], { opacity: 1 }, 0.86);
    tl.fromTo("#co-mitad-izq", { x: 0, rotation: 0 }, { x: -74, rotation: -10, duration: 0.4, ease: "back.out(2.4)", transformOrigin: "50% 100%" }, 0.86);
    tl.fromTo("#co-mitad-der", { x: 0, rotation: 0 }, { x: 74, rotation: 10, duration: 0.4, ease: "back.out(2.4)", transformOrigin: "50% 100%" }, 0.86);
    [
      ["#co-gota-1", -150, -160],
      ["#co-gota-2", 140, -190],
      ["#co-gota-3", -70, -250],
      ["#co-gota-4", 90, -120],
    ].forEach(([gota, x, y], i) => {
      tl.fromTo(gota, { opacity: 0, x: 0, y: 0, scale: 1 }, { opacity: 1, x: x * 0.5, y: y * 0.6, duration: 0.14, ease: "power2.out" }, 0.86 + i * 0.01);
      tl.to(gota, { x, y: y + 90, scale: 0.4, opacity: 0, duration: 0.36, ease: "power1.in" }, 1.0 + i * 0.01);
    });
    tl.to("#co-cuchillo", { y: -700, rotation: 8, duration: 0.34, ease: "power2.in" }, 1.0);

    // 1.10 "rompes miles de celulas": la lupa sale del corte.
    tl.to("#co-cebollas", { y: -556, scale: 0.5, duration: 0.45, ease: "power3.inOut" }, 1.08);
    tl.fromTo("#co-lupa", { scale: 0, opacity: 0, y: -260 }, { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: "back.out(1.5)" }, 1.14);
    tl.fromTo("#co-celdas", { scale: 1 }, { scale: 1.07, duration: 0.16, ease: "power2.out", svgOrigin: "0 0" }, 1.99);
    tl.to("#co-celdas", { scale: 1, duration: 0.24, ease: "sine.inOut", svgOrigin: "0 0" }, 2.15);
    // 2.48 "diminutas": la grieta del cuchillo cruza las celulas.
    tl.to("#co-grieta", { strokeDashoffset: 0, duration: 0.3, ease: "power2.in" }, 2.44);
    tl.fromTo("#co-lupa", { x: 0 }, { x: 10, duration: 0.05, repeat: 5, yoyo: true, ease: "sine.inOut" }, 2.72);
    tl.to("#co-grieta", { opacity: 0, duration: 0.3 }, 3.1);

    // 3.32 "Y dos sustancias": acercamiento a dos celulas vecinas.
    tl.to("#co-celdas", { scale: 2.6, duration: 0.6, ease: "power3.inOut", svgOrigin: "0 0" }, 3.15);
    tl.to("#co-enzimas", { opacity: 1, duration: 0.25 }, 3.55);
    tl.to("#co-azufres", { opacity: 1, duration: 0.25 }, 3.8);
    aparece("#co-etiqueta-enzima", 3.62);
    tl.fromTo("#co-guia-enzima", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.2, transformOrigin: "50% 0%" }, 3.74);
    aparece("#co-etiqueta-azufre", 3.9);
    tl.fromTo("#co-guia-azufre", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.2, transformOrigin: "50% 0%" }, 4.02);
    // Las sustancias se mueven dentro de su celula mientras "vivian separadas".
    ["#co-e1", "#co-e2", "#co-e3", "#co-e4", "#co-e5"].forEach((p, i) => {
      tl.fromTo(p, { y: 0 }, { y: i % 2 ? -7 : 7, duration: 0.5, repeat: 3, yoyo: true, ease: "sine.inOut" }, 3.8 + i * 0.05);
    });
    ["#co-a1", "#co-a2", "#co-a3", "#co-a4", "#co-a5"].forEach((p, i) => {
      tl.fromTo(p, { y: 0 }, { y: i % 2 ? 7 : -7, duration: 0.5, repeat: 3, yoyo: true, ease: "sine.inOut" }, 3.85 + i * 0.05);
    });
    // 5.08 "separadas": la pared que las separa se enciende.
    tl.to("#co-pared", { opacity: 1, duration: 0.2 }, 4.95);
    tl.fromTo("#co-pared", { scaleX: 1 }, { scaleX: 2.2, duration: 0.2, repeat: 3, yoyo: true, ease: "sine.inOut", transformOrigin: "50% 50%" }, 5.05);

    // 5.93 "se mezclan": la pared cae y todo se revuelve.
    tl.to(["#co-etiqueta-enzima", "#co-etiqueta-azufre", "#co-guia-enzima", "#co-guia-azufre"], { opacity: 0, duration: 0.16 }, 5.72);
    tl.to("#co-pared", { opacity: 0, scaleY: 0, duration: 0.14, ease: "power2.in", transformOrigin: "50% 50%" }, 5.86);
    tl.to("#co-union", { opacity: 1, duration: 0.12 }, 5.88);
    [

    [
      ["#co-a1", -58, 20],
      ["#co-a2", -104, -24],
      ["#co-a3", -150, 18],
      ["#co-a4", -120, -8],

    ].forEach(([p, x, y], i) => tl.to(p, { x, y, duration: 0.34, ease: "power2.inOut" }, 5.93 + i * 0.02));

      tl.fromTo(p, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2.5)", transformOrigin: "50% 50%" }, 6.08 + i * 0.04);
