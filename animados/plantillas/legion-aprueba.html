  <script>
    const tl = gsap.timeline({ paused: true });
    const r = window.__reloj("{{id}}");
    const fx = window.__fx;
    const D = {{datos}};
    const el = (nombre) => "#{{id}}-" + nombre;

    tl.fromTo(el("destello"), { opacity: 0.3 }, { opacity: 0, duration: 0.28, ease: "power2.out" }, 0);

    // "Trabajan juntos": la legion entra por filas y salta a la vez.
    const vaiven = r.dur > 2.2;
    [0.02, 0.06, 0.1, 0.14, 0.2, 0.24, 0.28, 0.36, 0.42].forEach((t, i) => {
      const n = i + 1;
      fx.entra(tl, el("ag-" + n), t, { y: 90 }, 0.3);
      if (vaiven) fx.flota(tl, el("ag-" + n + "-f"), 0.8, r.dur, 9, 0.3);
    });
    const juntos = Math.max(0.6, r.palabra(0, "juntos", 0.2));
    tl.fromTo(el("formacion"), { y: 0 }, { y: -30, duration: 0.12, ease: "power2.out" }, juntos);
    tl.to(el("formacion"), { y: 0, duration: 0.22, ease: "bounce.out" }, juntos + 0.12);

    // "dia y noche": sol, arco y luna.
    const dia = Math.max(juntos + 0.3, r.palabra(0, "día", 0.36));
    const noche = Math.max(dia + 0.25, r.palabra(0, "noche", 0.5));
    fx.entra(tl, el("sol"), dia, { rotation: -90 }, 0.32);
    tl.to(el("arco"), { strokeDashoffset: 0, duration: Math.max(0.2, noche - dia), ease: "power1.inOut" }, dia + 0.1);
    fx.entra(tl, el("luna"), noche, { rotation: 60 }, 0.32);

    // "y tu solo apruebas": aparece el boton, el dedo lo toca y queda aprobado.
    const pide = Math.max(noche + 0.3, r.palabra(0, "tú", 0.66));
    const toque = Math.max(pide + 0.45, r.palabra(0, "apruebas", 0.84));
    fx.entra(tl, el("pedir"), pide, { y: 70 }, 0.3);
    tl.fromTo(el("dedo"), { opacity: 0, x: 170, y: 150, scale: 1 }, { opacity: 0.95, x: 0, y: 0, duration: Math.max(0.15, toque - pide - 0.2), ease: "power2.out" }, pide + 0.2);
    tl.to(el("dedo"), { scale: 0.72, duration: 0.07, ease: "power2.in" }, toque);
    tl.to(el("dedo"), { scale: 1, opacity: 0, x: 60, y: 60, duration: 0.3, ease: "power2.out" }, toque + 0.1);
    tl.to(el("pedir"), { opacity: 0, duration: 0.06 }, toque + 0.06);
    tl.fromTo(el("aprobado"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.14, ease: "back.out(3)" }, toque + 0.06);
    tl.fromTo(el("onda"), { opacity: 0, scale: 1 }, { keyframes: [{ opacity: 0.9, duration: 0.04 }, { opacity: 0, scaleX: 1.35, scaleY: 2, duration: 0.5, ease: "power2.out" }] }, toque + 0.06);
    tl.to(el("formacion"), { y: -34, duration: 0.12, ease: "power2.out" }, toque + 0.14);
    tl.to(el("formacion"), { y: 0, duration: 0.24, ease: "bounce.out" }, toque + 0.26);

    window.__timelines["{{id}}"] = tl;
  </script>
