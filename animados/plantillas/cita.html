<!--
  Cita (videos propios, Narrador): una frase celebre o documentada, con su autor. Las palabras se
  encienden a medida que la voz avanza por la primera frase de la escena. Solo citas verificadas:
  si la atribucion esta en duda, no se usa.
  Necesita "estilo.tema" (archivo, laboratorio o pizarra).
  Datos: texto: la cita, 90 letras o menos (sin comillas: las pone la plantilla)
         autor: 26 letras o menos
         detalle (opcional): debajo del autor, 30 letras o menos ("Carta de 1861", "Medico hungaro")
{{?h}}
  Horizontal: propio. La cita en una hoja de papel a la derecha y, a la izquierda, el medallon del
  personaje (su busto dibujado, de la ficha: "personaje": "roosevelt", o con sus rasgos) con su rol
  debajo. Sin personaje, la hoja sola en el centro. Las palabras se encienden al paso de lo que se dice.
  En horizontal: texto de 150 letras o menos; autor (si falta, el "nombre" de la ficha) de 30;
  fuente (o detalle) de 50 ("Discurso en Berkeley, 1911"); rol de 30; medallon: false lo quita.
{{/h}}
-->
{{?v}}
<template>
  <style>
{{>narrador-css}}
    #{{id}}-comillas {
      position: absolute;
      left: 108px;
      top: 214px;
      width: 150px;
      height: 120px;
    }
    #{{id}}-comillas path {
      fill: var(--acento);
    }
    #{{id}}-texto {
      position: absolute;
      left: 108px;
      width: 864px;
      top: 350px;
      line-height: 1.14;
    }
    .{{id}}-pal {
      opacity: 0.18;
    }
    #{{id}}-firma {
      position: absolute;
      left: 108px;
      width: 864px;
      top: 880px;
      height: 200px;
      opacity: 0;
    }
    #{{id}}-raya {
      width: 120px;
      height: 10px;
      border-radius: 5px;
      background: var(--acento2);
      margin-bottom: 26px;
      box-shadow: var(--resplandor);
    }
    #{{id}}-autor {
      font-size: 58px;
      white-space: nowrap;
    }
    #{{id}}-detalle {
      margin-top: 8px;
      font-size: 42px;
      white-space: nowrap;
    }
  </style>

  <div id="root" data-composition-id="{{id}}" data-width="1080" data-height="1920">
    <div id="{{id}}-comillas"><svg class="{{id}}-arte" viewBox="0 0 150 120"><path d="M10 112 V70 C10 34 26 12 60 4 L66 20 C46 28 38 44 38 62 H64 V112 Z M84 112 V70 C84 34 100 12 134 4 L140 20 C120 28 112 44 112 62 H138 V112 Z" /></svg></div>
    <div id="{{id}}-texto" class="{{id}}-titulo"></div>
    <div id="{{id}}-firma">
      <div id="{{id}}-raya"></div>
      <div id="{{id}}-autor" class="{{id}}-titulo {{id}}-acento">{{d.autor}}</div>
      <div id="{{id}}-detalle" class="{{id}}-suave">{{d.detalle|}}</div>
    </div>
  </div>

  <script>
{{>narrador-js}}

    if (!D.detalle) $("detalle").style.display = "none";
    // Tamano: el mas grande con el que la cita cabe en el espacio (de 350 a 850 px).
    const texto = String(D.texto).trim();
    let tam = 92;
    const renglonesCon = (t) => Math.ceil((texto.length * t * T.anchoTitulo) / 820);
    while (tam > 48 && renglonesCon(tam) * tam * 1.14 > 480) tam -= 4;
    const caja = $("texto");
    caja.style.fontSize = tam + "px";
    const palabras = texto.split(/\s+/);
    palabras.forEach((p, i) => {
      const s = document.createElement("span");
      s.id = "{{id}}-w" + i;
      s.className = "{{id}}-pal";
      s.textContent = p;
      if (i) caja.appendChild(document.createTextNode(" "));
      caja.appendChild(s);
    });

    fx.entra(tl, el("comillas"), 0.02, { y: -40, rotation: -10 }, 0.4);
    tl.fromTo(el("texto"), { y: 30 }, { y: 0, duration: 0.4, ease: "power3.out" }, 0.05);
    // Cada palabra se enciende a su paso por la primera frase.
    palabras.forEach((p, i) => {
      const t = Math.max(0.1, r.en(0, 0.05 + (i / palabras.length) * 0.9));
      tl.to(el("w" + i), { opacity: 1, duration: 0.18, ease: "power1.out" }, tope(t, 0.8));
    });
    const tFirma = tope(Math.max(r.en(0, 0.8), 0.6), 0.8);
    tl.fromTo(el("firma"), { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, tFirma);
    tl.fromTo(el("raya"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, tFirma + 0.1);
    fx.golpe(tl, el("comillas"), tope(r.fin(0), 0.5), 1.12);

    window.__timelines["{{id}}"] = tl;
  </script>
</template>
{{/v}}
{{?h}}
<template>
  <style>
{{>narrador-css}}
    #{{id}}-medallon {
      position: absolute;
      left: 150px;
      top: 190px;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      overflow: hidden;
      border: 12px solid var(--marco);
      box-shadow: var(--marco-sombra);
      background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--acento2) 26%, var(--tarjeta)) 0%, var(--tarjeta) 72%);
      opacity: 0;
    }
    #{{id}}-busto {
      position: absolute;
      left: -12px;
      top: -12px;
      width: 520px;
      height: 520px;
    }
    #{{id}}-busto-f {
      width: 100%;
      height: 100%;
    }
    #{{id}}-placa {
      position: absolute;
      left: 160px;
      top: 740px;
      width: 500px;
      text-align: center;
      font-size: 40px;
      white-space: nowrap;
      opacity: 0;
    }
    #{{id}}-hoja {
      position: absolute;
      top: 130px;
      height: 760px;
      opacity: 0;
    }
    #{{id}}-hoja-f {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, var(--hoja-alta) 0%, var(--hoja-baja) 100%);
      border-radius: 6px;
      box-shadow: 0 30px 60px rgba(var(--sombra-rgb), 0.26), inset 0 0 0 2px rgba(var(--borde-rgb), 0.16), inset 0 0 60px rgba(var(--mancha-rgb), 0.16);
    }
    #{{id}}-comillas {
      position: absolute;
      left: 60px;
      top: 50px;
      width: 150px;
      height: 120px;
    }
    #{{id}}-comillas path {
      fill: var(--acento);
    }
    #{{id}}-texto {
      position: absolute;
      left: 80px;
      right: 70px;
      top: 170px;
      line-height: 1.16;
    }
    .{{id}}-pal {
      opacity: 0.18;
    }
    #{{id}}-firma {
      position: absolute;
      left: 80px;
      right: 70px;
      bottom: 44px;
      opacity: 0;
    }
    #{{id}}-raya {
      width: 140px;
      height: 8px;
      margin-bottom: 18px;
      border-radius: 4px;
      background: var(--acento2);
    }
    #{{id}}-autor {
      font-size: 52px;
      white-space: nowrap;
    }
    #{{id}}-fuente {
      margin-top: 4px;
      font-size: 36px;
      font-style: italic;
      white-space: nowrap;
    }
  </style>

  <div id="root" data-composition-id="{{id}}" data-width="{{ancho}}" data-height="{{alto}}">
    <div id="{{id}}-medallon"><div id="{{id}}-busto" class="{{id}}-il"><div id="{{id}}-busto-f"></div></div></div>
    <div id="{{id}}-placa" class="{{id}}-suave">{{d.rol|}}</div>
    <div id="{{id}}-hoja">
      <div id="{{id}}-hoja-f">
        <div id="{{id}}-comillas"><svg class="{{id}}-arte" viewBox="0 0 150 120"><path d="M10 112 V70 C10 34 26 12 60 4 L66 20 C46 28 38 44 38 62 H64 V112 Z M84 112 V70 C84 34 100 12 134 4 L140 20 C120 28 112 44 112 62 H138 V112 Z" /></svg></div>
        <div id="{{id}}-texto" class="{{id}}-titulo"></div>
        <div id="{{id}}-firma">
          <div id="{{id}}-raya"></div>
          <div id="{{id}}-autor" class="{{id}}-titulo {{id}}-acento"></div>
          <div id="{{id}}-fuente" class="{{id}}-suave">{{d.fuente|}}</div>
        </div>
      </div>
    </div>
  </div>

  <script>
{{>narrador-js}}
{{>escena-h-js}}
{{>figura-js}}

    // Con personaje (de la ficha o con sus rasgos), su medallon a la izquierda; si no, la cita sola.
    const conMedallon = D.medallon !== false && Boolean(D.personaje || D.piel || D.pelo || D.barba || D.peinado || D.sombrero);
    const autor = D.autor || D.nombre || "";
    $("autor").textContent = autor;
    if (!D.fuente) $("fuente").textContent = D.detalle || "";
    if (!D.fuente && !D.detalle) $("fuente").style.display = "none";
    const hoja = $("hoja");
    if (conMedallon) {
      Object.assign(hoja.style, { left: "760px", width: "1020px" });
      $("busto-f").innerHTML = `<svg class="{{id}}-arte {{id}}-fig" viewBox="0 0 400 400">${figura(D, "{{id}}", "busto")}</svg>`;
      if (!D.rol) $("placa").style.display = "none";
      else $("placa").style.fontSize = tamPara(D.rol, 500, 40, 28, T.anchoTexto) + "px";
    } else {
      Object.assign(hoja.style, { left: "300px", width: "1320px" });
      ["medallon", "placa"].forEach((k) => ($(k).style.display = "none"));
    }
    $("autor").style.fontSize = tamPara(autor, conMedallon ? 860 : 1160, 54, 36, T.anchoTitulo) + "px";

    // La cita: el tamano mas grande con el que cabe (del renglon 170 al 600 de la hoja).
    const texto = String(D.texto || "").trim();
    const anchoTexto = (conMedallon ? 1020 : 1320) - 150;
    let tam = 96;
    const renglones = (t) => Math.ceil((texto.length * t * T.anchoTitulo) / (anchoTexto * 0.94));
    while (tam > 44 && renglones(tam) * tam * 1.16 > 370) tam -= 4;
    const caja = $("texto");
    caja.style.fontSize = tam + "px";
    const palabras = texto.split(/\s+/).filter(Boolean);
    palabras.forEach((p, i) => {
      const s = document.createElement("span");
      s.id = "{{id}}-w" + i;
      s.className = "{{id}}-pal";
      s.textContent = p;
      if (i) caja.appendChild(document.createTextNode(" "));
      caja.appendChild(s);
    });

    // ---------- Movimiento ----------
    if (conMedallon) {
      fx.entra(tl, el("medallon"), 0.02, { x: -80 }, 0.42);
      tl.fromTo(el("busto"), { y: 140 }, { y: 0, duration: 0.55, ease: "back.out(1.5)" }, 0.16);
      fx.flota(tl, el("busto-f"), 0.8, r.dur, 5, 1.3);
      if (D.rol) fx.entra(tl, el("placa"), 0.45, { y: 20 }, 0.3);
      [1.0, 2.8, 4.6].filter((t) => t < r.dur - 0.4).forEach((t) => {
        tl.to(el("ojos"), { scaleY: 0.12, transformOrigin: "50% 50%", duration: 0.07, ease: "power1.in" }, t);
        tl.to(el("ojos"), { scaleY: 1, duration: 0.1, ease: "power1.out" }, t + 0.07);
      });
    }
    tl.fromTo(el("hoja"), { opacity: 0, y: 60, rotation: conMedallon ? 3 : -2 }, { opacity: 1, y: 0, rotation: conMedallon ? 1 : -0.8, duration: 0.5, ease: "back.out(1.4)" }, 0.08);
    fx.entra(tl, el("comillas"), 0.3, { y: -30, rotation: -10 }, 0.4);
    // Cada palabra se enciende al paso de lo que se dice en la escena.
    palabras.forEach((p, i) => {
      const t = Math.max(0.35, parte(0.04 + (i / palabras.length) * 0.86));
      tl.to(el("w" + i), { opacity: 1, duration: 0.18, ease: "power1.out" }, tope(t, 0.8));
    });
    const tFirma = tope(Math.max(parte(0.8), 0.8), 0.8);
    tl.fromTo(el("firma"), { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, tFirma);
    tl.fromTo(el("raya"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, tFirma + 0.1);
    fx.golpe(tl, el("comillas"), tope(parte(1), 0.5), 1.12);

    window.__timelines["{{id}}"] = tl;
  </script>
</template>
{{/h}}
