      height: 490px;

          <rect x="149" y="178" width="80" height="80" rx="16" />
          <rect x="251" y="178" width="80" height="80" rx="16" />

          <rect x="47" y="374" width="80" height="80" rx="16" />
          <rect x="149" y="374" width="80" height="80" rx="16" />

          <rect x="353" y="374" width="80" height="80" rx="16" />

        <g id="{{id}}-cupo-1">
          <rect class="{{id}}-tinta" x="149" y="178" width="80" height="80" rx="16" />
          <path d="M168 220 l14 14 l28 -30" stroke="#0d2029" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" />

        <g id="{{id}}-cupo-2">

        <g id="{{id}}-cupo-3">

        </g>
      </svg>
    </div>
  </div>

  <script>
{{>agente-js}}

    // El calendario entra y tres cupos se van llenando.
    fx.entra(tl, el("calendario"), 0.06, { x: 200 }, 0.34);
    const paso = Math.max(0.16, (a3 - a1) / 3);
    ["cupo-1", "cupo-2", "cupo-3"].forEach((c, i) => {
      tl.fromTo(el(c), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.24, ease: "back.out(3)", transformOrigin: "50% 50%" }, a1 + 0.12 + i * paso);
    });

    window.__timelines["{{id}}"] = tl;
  </script>
</template>
