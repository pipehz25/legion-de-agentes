<!--
  Personaje (videos propios, Narrador): un retrato de busto dibujado (silueta generica con una cara
  sencilla; nunca la cara real de nadie) en un medallon, con su nombre, sus anos y su rol.
  Una o dos frases del guion: el nombre aparece cuando se dice, los anos y el rol despues.
  Necesita "estilo.tema" (archivo, laboratorio o pizarra).
  Datos: nombre: 20 letras o menos ("Ignaz Semmelweis")
         anios: "1818-1865" (12 caracteres o menos)
         rol: 44 letras o menos, hasta dos renglones ("Medico del hospital de Viena")
         Opcionales para el dibujo (colores como "#2f4f7a"):
           piel, pelo, ropa, detalle (botones y adornos)
           peinado: "corto" (por defecto), "largo", "calvo", "recogido" o "peluca"
           barba: "ninguna" (por defecto), "bigote", "completa" o "patillas"
           sombrero: "ninguno" (por defecto), "bicornio", "copa" o "corona"
           gafas: true; bata: true (bata blanca de medico); charreteras: true (uniforme militar)
         palabra_anios, palabra_rol (opcionales): palabras dichas que hacen aparecer los anos y el rol
-->
<template>
  <style>
{{>narrador-css}}
    #{{id}}-medallon {
      position: absolute;
      left: 290px;
      top: 204px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      overflow: hidden;
      border: 12px solid var(--marco);
      box-shadow: var(--marco-sombra);
      background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--acento2) 26%, var(--tarjeta)) 0%, var(--tarjeta) 72%);
    }
    #{{id}}-busto {
      position: absolute;
      left: -12px;
      top: -12px;
      width: 500px;
      height: 500px;
    }
    #{{id}}-busto-f { width: 100%; height: 100%; }
    .{{id}}-texto-col {
      position: absolute;
      left: 90px;
      width: 900px;
      top: 748px;
      height: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    #{{id}}-nombre { flex: none; white-space: nowrap; }
    #{{id}}-anios { flex: none; margin-top: 10px; font-size: 58px; }
    #{{id}}-rol { flex: none; width: 860px; margin-top: 16px; line-height: 1.18; }
  </style>

  <div id="root" data-composition-id="{{id}}" data-width="1080" data-height="1920">
    <div id="{{id}}-medallon">
      <div id="{{id}}-busto" class="{{id}}-il"><div id="{{id}}-busto-f"></div></div>
    </div>
    <div class="{{id}}-texto-col">
      <div id="{{id}}-nombre" class="{{id}}-titulo">{{d.nombre}}</div>
      <div id="{{id}}-anios" class="{{id}}-cifra">{{d.anios}}</div>
      <div id="{{id}}-rol" class="{{id}}-suave">{{d.rol}}</div>
    </div>
  </div>

  <script>
{{>narrador-js}}

    // ---------- El retrato, armado con los datos (siempre igual para los mismos datos) ----------
    const color = (c, respaldo) => (/^#[0-9a-fA-F]{6}$/.test(c || "") ? c : respaldo);
    const mezcla = (c, otro, k) => {
      const a = [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
      const b = [1, 3, 5].map((i) => parseInt(otro.slice(i, i + 2), 16));
      return "#" + a.map((n, i) => Math.round(n + (b[i] - n) * k).toString(16).padStart(2, "0")).join("");
    };
    const piel = color(D.piel, "#e6b48e");
    const pelo = color(D.pelo, "#4a3222");
    const ropa = color(D.ropa, "#2f4f7a");
    const detalle = color(D.detalle, "#d9a032");
    const pielO = mezcla(piel, "#5a2a14", 0.28);
    const peloO = mezcla(pelo, "#000000", 0.35);
    const ropaO = mezcla(ropa, "#000000", 0.3);
    const ropaC = mezcla(ropa, "#ffffff", 0.14);
    const peinado = D.peinado || "corto";
    const barba = D.barba || "ninguna";
    const sombrero = D.sombrero || "ninguno";
    let s = "";
    // Torso: ropa, o bata blanca con la ropa como corbata.
    if (D.bata) {
      s += `<path d="M44 400 C48 330 104 298 164 290 L236 290 C296 298 352 330 356 400 Z" fill="${ropa}" />`;
      s += `<path d="M44 400 C48 330 104 298 164 290 L200 372 L180 400 Z" fill="#f2f5f7" /><path d="M356 400 C352 330 296 298 236 290 L200 372 L220 400 Z" fill="#dde3e8" />`;
      s += `<path d="M178 292 L200 330 L222 292 Z" fill="#f3eee3" /><path d="M193 300 L207 300 L211 352 L200 368 L189 352 Z" fill="${ropaO}" />`;
      s += `<path d="M150 296 L186 372" stroke="#c9d2d9" stroke-width="5" stroke-linecap="round" /><path d="M250 296 L214 372" stroke="#c3ccd3" stroke-width="5" stroke-linecap="round" />`;
    } else {
      s += `<path d="M44 400 C48 330 104 298 164 290 L236 290 C296 298 352 330 356 400 Z" fill="${ropa}" />`;
      s += `<path d="M236 290 C296 298 352 330 356 400 L272 400 C278 350 264 314 236 290 Z" fill="${ropaO}" />`;
      s += `<path d="M164 290 L200 348 L186 400 L124 400 C132 352 146 312 164 290 Z" fill="${ropaC}" /><path d="M236 290 L200 348 L214 400 L276 400 C268 352 254 312 236 290 Z" fill="${ropaO}" />`;
      s += `<path d="M168 288 L200 342 L232 288 L220 284 L200 318 L180 284 Z" fill="#f3eee3" />`;
      s += `<circle cx="200" cy="366" r="7" fill="${detalle}" /><circle cx="200" cy="392" r="7" fill="${detalle}" />`;
    }
    if (D.charreteras) {
      for (const x of [92, 308]) {
        s += `<ellipse cx="${x}" cy="318" rx="44" ry="15" fill="${detalle}" />`;
        for (let k = -3; k <= 3; k++) s += `<rect x="${x + k * 11 - 3}" y="324" width="6" height="22" rx="3" fill="${detalle}" />`;
      }
    }
    // Cuello y cabeza.
    s += `<path d="M174 234 L226 234 L230 298 L170 298 Z" fill="${pielO}" />`;
    if (peinado === "largo" || peinado === "peluca") {
      const c = peinado === "peluca" ? "#e9e5dc" : pelo;
      s += `<path d="M134 168 C120 222 126 272 152 298 L178 292 C156 262 150 220 154 176 Z" fill="${c}" /><path d="M266 168 C280 222 274 272 248 298 L222 292 C244 262 250 220 246 176 Z" fill="${mezcla(c, "#000000", 0.18)}" />`;
    }
    s += `<ellipse cx="136" cy="186" rx="11" ry="18" fill="${piel}" /><ellipse cx="264" cy="186" rx="11" ry="18" fill="${pielO}" />`;
    s += `<ellipse cx="200" cy="178" rx="64" ry="76" fill="${piel}" />`;
    s += `<path d="M212 104 C246 112 264 144 264 178 C264 220 238 252 200 254 C230 236 244 210 244 178 C244 146 232 118 212 104 Z" fill="${pielO}" opacity="0.55" />`;
    s += `<circle cx="160" cy="212" r="11" fill="#e0705a" opacity="0.22" /><circle cx="240" cy="212" r="11" fill="#e0705a" opacity="0.22" />`;
    // Pelo.
    if (peinado === "corto" || peinado === "recogido" || peinado === "largo") {
      s += `<path d="M136 182 C128 120 164 94 202 94 C242 94 272 124 264 182 C258 152 240 134 214 130 C188 140 158 146 140 178 Z" fill="${pelo}" />`;
      s += `<path d="M214 130 C240 134 258 152 264 182 C270 130 246 98 214 96 C232 108 236 120 214 130 Z" fill="${peloO}" />`;
      if (peinado === "recogido") s += `<circle cx="200" cy="90" r="27" fill="${pelo}" /><circle cx="210" cy="84" r="9" fill="${peloO}" />`;
    } else if (peinado === "calvo") {
      s += `<path d="M136 200 C126 170 132 148 148 138 C142 162 146 182 154 204 Z" fill="${pelo}" /><path d="M264 200 C274 170 268 148 252 138 C258 162 254 182 246 204 Z" fill="${peloO}" />`;
      s += `<path d="M166 120 C178 110 196 106 212 108" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.35" />`;
    } else if (peinado === "peluca") {
      s += `<path d="M134 186 C126 118 162 92 202 92 C244 92 274 120 266 186 C258 150 236 132 200 132 C166 132 142 150 134 186 Z" fill="#efebe3" />`;
      for (const [x, y] of [[136, 200], [134, 232], [264, 200], [266, 232]]) s += `<circle cx="${x}" cy="${y}" r="17" fill="${x < 200 ? "#efebe3" : "#d9d3c7"}" />`;
    }
    // Cara: cejas, ojos, nariz, barba y boca.
    s += `<path d="M163 167 Q177 159 191 165" stroke="${peloO}" stroke-width="6" fill="none" stroke-linecap="round" /><path d="M209 165 Q223 159 237 167" stroke="${peloO}" stroke-width="6" fill="none" stroke-linecap="round" />`;
    s += `<g id="{{id}}-ojos"><ellipse cx="177" cy="186" rx="7" ry="8.5" fill="#2a1a12" /><ellipse cx="223" cy="186" rx="7" ry="8.5" fill="#2a1a12" /><circle cx="179.5" cy="183" r="2.4" fill="#ffffff" /><circle cx="225.5" cy="183" r="2.4" fill="#ffffff" /></g>`;
    s += `<path d="M201 192 Q208 208 198 215" stroke="${pielO}" stroke-width="5" fill="none" stroke-linecap="round" />`;
    if (barba === "completa") s += `<path d="M136 188 C138 248 168 272 200 272 C232 272 262 248 264 188 C258 214 242 232 226 234 Q200 246 174 234 C158 232 142 214 136 188 Z" fill="${pelo}" />`;
    if (barba === "patillas") s += `<path d="M137 176 L151 176 L156 236 C146 230 139 214 137 176 Z" fill="${pelo}" /><path d="M263 176 L249 176 L244 236 C254 230 261 214 263 176 Z" fill="${peloO}" />`;
    s += `<path d="M185 229 Q200 238 215 229" stroke="#7d3f30" stroke-width="5" fill="none" stroke-linecap="round" />`;
    if (barba === "bigote" || barba === "completa" || barba === "patillas") s += `<path d="M176 222 Q200 206 224 222 Q212 228 200 224 Q188 228 176 222 Z" fill="${barba === "patillas" ? pelo : peloO}" />`;
    if (D.gafas) s += `<g stroke="#3b2a20" stroke-width="5" fill="#ffffff" fill-opacity="0.12"><circle cx="177" cy="186" r="19" /><circle cx="223" cy="186" r="19" /></g><path d="M196 184 Q200 180 204 184" stroke="#3b2a20" stroke-width="5" fill="none" />`;
    // Sombrero.
    if (sombrero === "bicornio") {
      s += `<path d="M62 132 C108 108 140 50 200 46 C260 50 292 108 338 132 C292 122 248 120 200 126 C152 120 108 122 62 132 Z" fill="#26231f" />`;
      s += `<path d="M200 46 C260 50 292 108 338 132 C304 126 270 122 238 123 C252 96 238 64 200 46 Z" fill="#1b1916" />`;
      s += `<path d="M62 132 C110 122 152 120 200 126 C248 120 290 122 338 132 C292 146 246 152 200 152 C154 152 108 146 62 132 Z" fill="#161412" />`;
      s += `<path d="M68 131 C112 122 154 121 200 127 C246 121 288 122 332 131" stroke="${detalle}" stroke-width="5" fill="none" stroke-linecap="round" />`;
      s += `<circle cx="250" cy="92" r="17" fill="#2f4f9e" /><circle cx="250" cy="92" r="11" fill="#f4efe4" /><circle cx="250" cy="92" r="5" fill="#c8342c" />`;
    } else if (sombrero === "copa") {
      s += `<rect x="146" y="30" width="108" height="86" rx="6" fill="#26231f" /><rect x="214" y="30" width="40" height="86" fill="#1b1916" /><rect x="146" y="92" width="108" height="14" fill="${detalle}" />`;
      s += `<ellipse cx="200" cy="118" rx="88" ry="13" fill="#161412" />`;
    } else if (sombrero === "corona") {
      s += `<path d="M138 120 L130 64 L166 92 L200 50 L234 92 L270 64 L262 120 Z" fill="#f2b735" /><path d="M234 92 L270 64 L262 120 L238 120 Z" fill="#d6971d" />`;
      s += `<rect x="134" y="110" width="132" height="22" rx="8" fill="#e3a52a" /><circle cx="200" cy="121" r="7" fill="#c8342c" /><circle cx="168" cy="121" r="5" fill="#2f6fc8" /><circle cx="232" cy="121" r="5" fill="#2f8f5b" />`;
    }
    $("busto-f").innerHTML = '<svg class="{{id}}-arte" viewBox="0 0 400 400">' + s + "</svg>";

    // ---------- Textos ----------
    $("nombre").style.fontSize = tamPara(D.nombre, 900, 96, 56, T.anchoTitulo) + "px";
    $("rol").style.fontSize = (String(D.rol).length <= 26 ? 50 : 44) + "px";

    // ---------- Movimiento ----------
    fx.entra(tl, el("medallon"), 0.02, { y: 80 }, 0.42);
    tl.fromTo(el("busto"), { y: 140 }, { y: 0, duration: 0.55, ease: "back.out(1.5)" }, 0.18);
    fx.flota(tl, el("busto-f"), 0.8, r.dur, 5, 1.3);
    const tNombre = tope(cuando(D.nombre, 0.08), 1.2);
    const tAnios = tope(Math.max(tNombre + 0.45, cuando(D.palabra_anios, 0.42)), 0.9);
    const tRol = tope(Math.max(tAnios + 0.45, cuando(D.palabra_rol, 0.66)), 0.7);
    fx.entra(tl, el("nombre"), tNombre, { y: 40 }, 0.36);
    fx.entra(tl, el("anios"), tAnios, { y: 30 }, 0.32);
    fx.entra(tl, el("rol"), tRol, { y: 30 }, 0.32);
    fx.golpe(tl, el("medallon"), tope(Math.max(tNombre + 0.05, 0.75), 0.6), 1.05);
    // Parpadea un par de veces (finito).
    [0.9, 2.6, 4.4].filter((t) => t < r.dur - 0.4).forEach((t) => {
      tl.to(el("ojos"), { scaleY: 0.12, transformOrigin: "50% 50%", duration: 0.07, ease: "power1.in" }, t);
      tl.to(el("ojos"), { scaleY: 1, duration: 0.1, ease: "power1.out" }, t + 0.07);
    });

    window.__timelines["{{id}}"] = tl;
  </script>
</template>
