    <div id="{{id}}-chispa-3" class="{{id}}-chispa" style="left: 512px; top: 730px"><svg class="{{id}}-arte" viewBox="0 0 56 56"><use href="#{{id}}-sim-chispa" /></svg></div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const r = window.__reloj("{{id}}");
    const fx = window.__fx;
    const D = {{datos}};
    const el = (nombre) => "#{{id}}-" + nombre;

    tl.fromTo(el("destello"), { opacity: 0.3 }, { opacity: 0, duration: 0.28, ease: "power2.out" }, 0);

    // El reloj comido se va y las tareas (vienen de la escena anterior) se ordenan en cuadricula.
    tl.fromTo(el("reloj"), { scale: 1, rotation: 0, opacity: 1 }, { scale: 0, rotation: 140, opacity: 0, duration: 0.32, ease: "power2.in" }, 0.04);
    [
      [-39, -300, -6],
      [39, -260, 5],
      [-55, -90, 5],
      [45, -60, -5],
    ].forEach(([x, y, giro], i) => {
      tl.fromTo(el("chip-" + (i + 1)), { x, y, rotation: giro }, { x: 0, y: 0, rotation: 0, duration: 0.5, ease: "power3.inOut" }, 0.1 + i * 0.04);
    });

    // "creamos": se enciende el nucleo y las cuatro bases donde va a nacer cada agente.
    const creamos = Math.max(0.5, r.palabra(0, "creamos", 0.14));
    [1, 2, 3, 4].forEach((n, i) => {
      tl.fromTo(el("base-" + n), { opacity: 0, scaleX: 0 }, { opacity: 0.7, scaleX: 1, duration: 0.3, ease: "power2.out" }, creamos + i * 0.06);
    });
    fx.entra(tl, el("nucleo"), creamos + 0.12, {}, 0.36);

    // Nace un agente por cada tarea: el primero en "agente", los otros en "para cada una".
    const nacen = [r.palabra(0, "agente", 0.3), r.palabra(0, "para", 0.8), r.palabra(0, "cada", 0.87), r.palabra(0, "una", 0.94)];
    nacen[0] = Math.max(nacen[0], creamos + 0.4);
    for (let i = 1; i < nacen.length; i++) nacen[i] = Math.max(nacen[i], nacen[i - 1] + 0.18);
    nacen.forEach((t, i) => {
      const n = i + 1;
      tl.to(el("linea-" + n), { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, t - 0.12);
      fx.entra(tl, el("ag-" + n), t, { y: -90 }, 0.36);
      fx.golpe(tl, el("chip-" + n), t + 0.22, 1.1);
      if (r.dur - t > 1.9) fx.flota(tl, el("ag-" + n + "-f"), t + 0.4, r.dur, 9, 0.7);
    });

    // "inteligencia artificial": el nucleo late y suelta chispas.
    const ia = r.palabra(0, "inteligencia", 0.45);
    const ia2 = Math.max(ia + 0.4, r.palabra(0, "artificial", 0.62));
    fx.golpe(tl, el("nucleo"), ia, 1.22);
    fx.golpe(tl, el("nucleo"), ia2, 1.22);
    [
      ["onda-1", ia],
      ["onda-2", ia2],
    ].forEach(([onda, t]) => {
      tl.fromTo(el(onda), { opacity: 0, scale: 1 }, { keyframes: [{ opacity: 0.9, duration: 0.05 }, { opacity: 0, scale: 3.2, duration: 0.55, ease: "power2.out" }] }, t);
    });
    [
      ["chispa-1", ia + 0.05],
      ["chispa-2", ia + 0.2],
      ["chispa-3", ia2 + 0.05],
    ].forEach(([c, t]) => {
      tl.fromTo(el(c), { opacity: 0, scale: 0, rotation: -40 }, { opacity: 1, scale: 1.2, rotation: 20, duration: 0.2, ease: "back.out(3)" }, t);
      tl.to(el(c), { opacity: 0, scale: 0.3, rotation: 80, duration: 0.3, ease: "power2.in" }, t + 0.3);
    });

    window.__timelines["{{id}}"] = tl;
  </script>
