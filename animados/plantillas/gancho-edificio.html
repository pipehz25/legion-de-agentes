  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const r = window.__reloj("{{id}}");
    const fx = window.__fx;
    const D = {{datos}};
    const el = (nombre) => "#{{id}}-" + nombre;

    // El titulo se ajusta a su linea mas larga.
    const largo = Math.max(...D.lineas.map((l) => l.length));
    document.querySelector(el("titulo")).style.fontSize = Math.min(94, Math.floor(900 / (largo * 0.5))) + "px";

    // El titulo ya esta en el cuadro 0 (es la portada); solo se asienta.
    tl.fromTo(el("linea-1"), { y: 20 }, { y: 0, duration: 0.4, ease: "power3.out" }, 0);
    tl.fromTo(el("linea-2"), { y: 30 }, { y: 0, duration: 0.45, ease: "power3.out" }, 0.04);
    tl.fromTo(el("linea-3"), { y: 40 }, { y: 0, duration: 0.5, ease: "power3.out" }, 0.08);
    tl.fromTo(el("edificio"), { y: 50, scale: 0.92 }, { y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 0);
    tl.fromTo(el("luna"), { y: 0 }, { y: -14, duration: 1.2, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);

    // Las ventanas se encienden una por una: adentro ya hay agentes trabajando.
    const paso = Math.min(0.2, (r.dur - 0.7) / 10);
    [5, 1, 9, 4, 12, 3, 8, 10, 6, 11].forEach((n, i) => {
      tl.to(el("luz-" + n), { opacity: 1, duration: 0.1, ease: "power2.out" }, 0.3 + i * paso);
    });
    fx.golpe(tl, el("edificio"), r.en(0, 0.42), 1.06);

    // "mientras duermes": las zetas suben.
    const duerme = r.palabra(0, "mientras", 0.6);
    ["z-1", "z-2", "z-3"].forEach((z, i) => {
      const t = duerme + i * 0.18;
      tl.fromTo(el(z), { opacity: 0, y: 40, x: 20, scale: 0.5 }, { opacity: 0.95, y: 0, x: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, t);
      tl.to(el(z), { y: -26, duration: Math.max(0.3, r.dur - t - 0.35), ease: "sine.inOut" }, t + 0.3);
    });
    fx.golpe(tl, el("duermes"), r.en(0, 0.86), 1.14);

    // Las estrellas titilan.
    const titileos = 2 * Math.max(1, Math.floor((r.dur - 0.6) / 0.9)) - 1;
    ["estrella-1", "estrella-2", "estrella-3", "estrella-4", "estrella-5"].forEach((e, i) => {
      tl.fromTo(el(e), { opacity: 0.25, scale: 0.7 }, { opacity: 1, scale: 1.2, duration: 0.45, ease: "sine.inOut", repeat: titileos, yoyo: true }, 0.1 + i * 0.07);
    });

    window.__timelines["{{id}}"] = tl;
  </script>
</template>
