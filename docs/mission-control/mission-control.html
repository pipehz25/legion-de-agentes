<style>
/* Layout: encabezado con pestañas; cada pestaña es una vista de una columna con tarjetas; los detalles se abren en un panel modal. */
:root {

    --santiago: #ee8068; --felipe: #7f9ff0; --claude: #ad90f2; --todos: #9ba4b3;
    --ok: #5fc28d; --warn: #e3ab3e; --bad: #f2867c; --info: #6cb6d6;

  }
}
:root[data-theme="dark"] {
  --bg: #0d1015; --surface: #161a21; --soft: #1e232b; --ink: #e7eaf0; --muted: #9ba4b3; --line: #2a303a;
  --santiago: #ee8068; --felipe: #7f9ff0; --claude: #ad90f2; --todos: #9ba4b3;
  --ok: #5fc28d; --warn: #e3ab3e; --bad: #f2867c; --info: #6cb6d6;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-block: 20px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));

.who-pick select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.tabs-scroll { overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; min-width: max-content; }

.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 600; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

.card {

<script>

  var UNITS = {

  var STATES = [

  var STATE_LABEL = {};
  STATES.forEach(function (s) { STATE_LABEL[s[0]] = s[1]; });
  var CLOSED = { done: true, canceled: true };
